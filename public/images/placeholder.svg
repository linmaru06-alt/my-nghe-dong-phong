<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2314"/>
      <stop offset="50%" stop-color="#5C3A21"/>
      <stop offset="100%" stop-color="#2A160C"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3D2314" stop-opacity="0"/>
    </radialGradient>
    <pattern id="woodGrain" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M0 20 Q40 10 80 20 T160 20" fill="none" stroke="#6E4527" stroke-width="0.8" opacity="0.4"/>
      <path d="M0 40 Q40 50 80 40 T160 40" fill="none" stroke="#4A2B18" stroke-width="0.8" opacity="0.4"/>
      <path d="M0 60 Q40 55 80 60 T160 60" fill="none" stroke="#6E4527" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#woodGrain)"/>
  <circle cx="400" cy="270" r="180" fill="url(#goldGlow)"/>

  <!-- Border Ornament -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#C5A059" stroke-width="1.5" opacity="0.5" rx="8"/>
  <rect x="32" y="32" width="736" height="536" fill="none" stroke="#C5A059" stroke-width="0.5" opacity="0.3" rx="6"/>

  <!-- Central Icon: Woodcraft Seal -->
  <g transform="translate(400, 240)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="0" r="48" fill="#2A160C" stroke="#C5A059" stroke-width="1" opacity="0.9"/>
    
    <!-- Stylized Tree / Craft Symbol -->
    <path d="M0 -30 L-18 2 L-6 2 L-20 22 L20 22 L6 2 L18 2 Z" fill="#D4AF37" opacity="0.9"/>
    <rect x="-3" y="22" width="6" height="12" fill="#C5A059"/>
    <circle cx="0" cy="-32" r="3" fill="#FFE5A3"/>
  </g>

  <!-- Brand Typography -->
  <text x="400" y="350" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="bold" fill="#FDFBF7" letter-spacing="2">
    MỸ NGHỆ ĐÔNG PHONG
  </text>
  <text x="400" y="380" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-size="12" font-weight="500" fill="#C5A059" letter-spacing="4">
    TINH HOA GỖ QUÝ VIỆT NAM
  </text>
  <text x="400" y="415" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#A89284">
    Ảnh tác phẩm đang được đồng bộ chất lượng cao
  </text>
</svg>
