<script>
  // Dynamic Zoom & Thumb Selection Logic
  (function() {
    let currentZoom = 1.25;
    const img = document.getElementById('macro-image');
    const zoomPill = document.getElementById('zoom-level');
    const container = document.getElementById('grain-viewer-container');
    const reticle = document.getElementById('crosshair-reticle');

    // Double Tap Zoom Support
    let lastTap = 0;
    container.addEventListener('touchend', function(e) {
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;
      if (tapLength < 300 && tapLength > 0) {
        toggleZoom();
        e.preventDefault();
      }
      lastTap = currentTime;
    });

    // Toggle Zoom Handler
    function toggleZoom() {
      if (currentZoom >= 2.2) {
        currentZoom = 1.0;
      } else if (currentZoom >= 1.25) {
        currentZoom = 2.4;
      } else {
        currentZoom = 1.25;
      }
      applyZoom();
    }

    function applyZoom() {
      img.style.transform = `scale(${currentZoom})`;
      zoomPill.textContent = `${Math.round(currentZoom * 100)}%`;
    }

    document.getElementById('btn-zoom-toggle').addEventListener('click', toggleZoom);

    // Dynamic Reticle Movement Follower on Pan/Touch
    container.addEventListener('touchmove', function(e) {
      if (e.touches.length === 1) {
        const rect = container.getBoundingClientRect();
        const touch = e.touches[0];
        const x = touch.clientX - rect.left;
        const y = touch.clientY - rect.top;
        if (x >= 0 && x <= rect.width && y >= 0 && y <= rect.height) {
          reticle.style.left = `${x}px`;
          reticle.style.top = `${y}px`;
        }
      }
    }, { passive: true });

    // Global thumbnail selector callback
    window.selectThumbnail = function(index, title, defaultZoom) {
      document.getElementById('counter-pill').textContent = `${index + 1} / 5`;
      document.getElementById('grain-title').textContent = title;
      currentZoom = parseFloat(defaultZoom) / 100;
      applyZoom();

      const thumbs = document.querySelectorAll('.thumb-item');
      thumbs.forEach((th, i) => {
        if (i === index) {
          th.classList.remove('opacity-60');
          th.classList.add('shadow-md', 'shadow-secondary-container/20');
        } else {
          th.classList.add('opacity-60');
          th.classList.remove('shadow-md', 'shadow-secondary-container/20');
        }
      });
    };

    // Close button feedback
    document.getElementById('btn-close').addEventListener('click', function() {
      if (window.history.length > 1) {
        window.history.back();
      }
    });
  })();
</script></main></body></html>
