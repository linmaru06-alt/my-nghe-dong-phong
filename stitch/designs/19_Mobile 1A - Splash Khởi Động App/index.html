<script>
    (function() {
      const progressBar = document.getElementById('splash-progress-bar');
      const statusText = document.getElementById('splash-status-text');
      
      const stages = [
        { percent: '22%', text: 'Đang tải tinh hoa mộc...' },
        { percent: '58%', text: 'Chọn lọc chất gỗ quý...' },
        { percent: '86%', text: 'Hoàn thiện vân sắc...' },
        { percent: '100%', text: 'Khởi tạo không gian mỹ nghệ...' }
      ];

      let currentStep = 0;

      function advanceProgress() {
        if (currentStep < stages.length) {
          const step = stages[currentStep];
          if (progressBar) {
            progressBar.style.width = step.percent;
          }
          if (statusText) {
            statusText.textContent = step.text;
          }
          currentStep++;
          setTimeout(advanceProgress, 650);
        }
      }

      // Smooth initiation
      setTimeout(advanceProgress, 200);
    })();
  </script>
